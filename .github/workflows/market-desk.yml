name: Market Desk and Pulse refresh
on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 UTC (GitHub drops some scheduled runs, hourly keeps the page current)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: market-desk, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch public feeds and rank
        env: { DESK_PUBLIC_ONLY: "1", DESK_OUT: "/tmp/desk" }
        run: python3 _desk/desk.py --live
      - name: Publish only if the feed is healthy
        run: |
          python3 - <<'PY'
          import json, shutil, sys
          d = json.load(open("/tmp/desk/desk.json"))
          b = json.load(open("/tmp/desk/brief.json"))
          for h in b["health"]:
              if h["public"] and h["state"] != "healthy":
                  print(f"::warning::{h['name']} is {h['state']} ({h['url']})")
          if len(d["items"]) < 5:
              print("::error::Fewer than 5 stories, keeping the previous feed"); sys.exit(0)
          shutil.copy("/tmp/desk/desk.json", "data/desk.json")
          PY
      - name: Update internal weekly report
        continue-on-error: true
        run: python3 _desk/weekly.py log /tmp/desk/brief.json
      - name: Refresh Market Pulse from FRED (checked)
        continue-on-error: true
        run: python3 _desk/pulse.py
      - name: Refresh AI Search Watch (keeps previous file if too few stories)
        continue-on-error: true
        run: python3 _desk/search.py
      - name: Add new SocialDM blog posts to the Insights library
        continue-on-error: true
        run: python3 _desk/insights.py
      - name: Commit
        run: |
          git config user.name "market-desk-bot"
          git config user.email "market-desk-bot@users.noreply.github.com"
          git add data/desk.json data/pulse.json data/search.json data/insights.json _desk/state.json _desk/week_log.json _desk/reports 2>/dev/null || git add data/desk.json data/pulse.json data/search.json
          git diff --cached --quiet || git commit -m "Market Desk refresh $(date -u +%FT%TZ)"
          git push
